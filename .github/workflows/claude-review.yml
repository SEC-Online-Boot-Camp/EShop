name: Claude Review

# PR の差分を Claude がレビューし、インラインコメントと総評を投稿する。
# レビュー観点は非公開リポジトリ Kenta-Shimoda/review-guidelines にあり、実行時に GUIDELINES_PAT で読む。
# （このリポジトリは所有者が別の公開リポジトリのため、review-guidelines の reusable workflow は呼べない。
#   その処理をこのファイルに直接書いている）
#
# 必要な secrets（リポジトリの Settings → Secrets and variables → Actions に登録する）:
#   CLAUDE_CODE_OAUTH_TOKEN : Claude Code の OAuth トークン
#   GUIDELINES_PAT          : review-guidelines を読める PAT（Contents: Read のみでよい）

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fork-notice:
    # fork からの PR には secrets が渡らないため、レビューは行わない（失敗ではなくスキップ扱い）。
    # 何もせずに終わると理由が分からないので、ここで notice だけ出す。
    name: fork からの PR のためスキップ
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "::notice::fork からの PR には secrets が渡らないため、Claude によるレビューはスキップします。"

  resolve:
    name: 工程・スタックの判定
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      phase: ${{ steps.detect.outputs.phase }}
      phase_source: ${{ steps.detect.outputs.phase_source }}
      stack: ${{ steps.detect.outputs.stack }}
    steps:
      - name: secrets の登録を確認
        env:
          HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_GUIDELINES_PAT: ${{ secrets.GUIDELINES_PAT != '' }}
        run: |
          missing=""
          [ "$HAS_CLAUDE_TOKEN" = "true" ] || missing="$missing CLAUDE_CODE_OAUTH_TOKEN"
          [ "$HAS_GUIDELINES_PAT" = "true" ] || missing="$missing GUIDELINES_PAT"
          if [ -n "$missing" ]; then
            echo "::error::secrets が登録されていません:${missing}。Settings → Secrets and variables → Actions に登録してください。"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # 比較の基準は PR の向き先（main でも coupon でも動くように）
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # --- 1. ラベルによる明示指定を最優先 ---
          PHASE_LABELS=$(echo "$LABELS" | tr ',' '\n' | sed -n 's/^phase://p')
          if [ "$(echo "$PHASE_LABELS" | grep -c . || true)" -gt 1 ]; then
            echo "::error::phase: ラベルが複数付いています。工程は1つだけ指定してください: $(echo $PHASE_LABELS | tr '\n' ' ')"
            exit 1
          fi
          PHASE=$(echo "$PHASE_LABELS" | head -n1)
          PHASE_SOURCE=label
          STACK=$(echo "$LABELS" | tr ',' '\n' | sed -n 's/^stack://p' | head -n1)

          # --- 2. ラベルがなければ変更ファイルのパスから判別 ---
          FILES=""
          if [ -z "$PHASE" ] || [ -z "$STACK" ]; then
            git fetch --no-tags origin "$BASE_REF"
            FILES=$(git -c core.quotepath=false diff --name-only "origin/${BASE_REF}...HEAD")
          fi

          if [ -z "$PHASE" ]; then
            PHASE_SOURCE=auto
            # 工程番号は review-guidelines の phases/ の通番。複数に当たるときは大きい方を採る。
            # 並びの順に判定するので、テスト（frontend/src/ の中にある）を画面より先に書く。
            MAX=0
            while IFS= read -r f; do
              n=0
              case "$f" in
                backend/tests/*)                      n=6 ;;  # 単体試験
                frontend/*.test.*|frontend/src/test/*) n=6 ;;  # 単体試験（テスト本体・テスト用の補助）
                backend/app/*|frontend/src/*)         n=5 ;;  # 実装
                docs/*詳細設計*)                       n=4 ;;  # 詳細設計
                docs/*設計*)                           n=3 ;;  # 基本設計
                docs/*要件*)                           n=2 ;;  # 要件定義
              esac
              if [ "$n" -gt "$MAX" ]; then MAX=$n; fi
            done <<< "$FILES"
            PHASES=(_ project-planning requirements basic-design detailed-design \
                    implementation unit-test integration-test system-test)
            if [ "$MAX" -eq 0 ]; then
              PHASE="implementation"
              echo "::notice::工程を判別できなかったため implementation を適用します（phase: ラベルで上書き可能）"
            else
              PHASE="${PHASES[$MAX]}"
            fi
          fi

          # --- 3. スタック: ラベルがなければ画面（frontend/）の変更から判別 ---
          # バックエンド（Python）向けのスタック観点は review-guidelines にないため、空のままにする。
          if [ -z "$STACK" ] && echo "$FILES" | grep -qE '^frontend/.*\.tsx?$|^frontend/(.*/)?package\.json$'; then
            STACK="typescript-node"
          fi

          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          echo "phase_source=$PHASE_SOURCE" >> "$GITHUB_OUTPUT"
          echo "stack=$STACK" >> "$GITHUB_OUTPUT"
          echo "判定結果: phase=$PHASE（${PHASE_SOURCE}） stack=${STACK:-なし} (ラベル: ${LABELS:-なし})"

  format-check:
    # 変更された Markdown の書式チェック（markdownlint・textlint の表記ゆれ・Mermaid の構文）。
    # 変更された .md がなければ、ツールの取得（npm ci）もせずに終える。
    name: Markdown の書式チェック
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # PR の向き先との共通祖先が要る

      - name: 対象の .md を特定
        id: targets
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          # 削除（D）と、中身の変わらないリネーム（R100）は対象外。リネームは移動先のパスを採る。
          git -c core.quotepath=false diff --name-status -M "origin/${BASE_REF}...HEAD" -- '*.md' \
            | awk -F'\t' '$1 ~ /^D/ || $1 == "R100" { next } $1 ~ /^[RC]/ { print $3; next } { print $2 }' \
            > /tmp/targets.txt || true
          # 念のため実在するファイルのみ残す
          : > targets.txt
          while IFS= read -r f; do [ -n "$f" ] && [ -f "$f" ] && echo "$f" >> targets.txt; done < /tmp/targets.txt
          if [ ! -s targets.txt ]; then
            echo "変更された .md はないため、書式チェックをスキップします。"
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
            echo "=== 対象 ==="; cat targets.txt
          fi

      - name: Checkout review guidelines
        if: steps.targets.outputs.has_targets == 'true'
        uses: actions/checkout@v7
        with:
          repository: Kenta-Shimoda/review-guidelines
          token: ${{ secrets.GUIDELINES_PAT }}
          path: .review-guidelines

      - uses: actions/setup-node@v7
        if: steps.targets.outputs.has_targets == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .review-guidelines/package-lock.json

      - name: Cache Puppeteer browser
        if: steps.targets.outputs.has_targets == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('.review-guidelines/package-lock.json') }}

      - name: チェック用ツールのインストール
        if: steps.targets.outputs.has_targets == 'true'
        working-directory: .review-guidelines
        run: npm ci

      - name: markdownlint
        if: steps.targets.outputs.has_targets == 'true'
        run: |
          set -uo pipefail
          mapfile -t FILES < targets.txt
          set +e
          OUT=$(.review-guidelines/node_modules/.bin/markdownlint-cli2 --config .review-guidelines/lint/.markdownlint-cli2.jsonc "${FILES[@]}" 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          # 形式: <path>.md:<line>[:<col>] <level> <rule> <description>
          echo "$OUT" | sed -nE 's/^([^:]+\.md):([0-9]+)(:[0-9]+)? +(.*)$/::error file=\1,line=\2::markdownlint: \4/p'
          exit $CODE

      - name: textlint（prh の表記ゆれ）
        if: steps.targets.outputs.has_targets == 'true'
        run: |
          set -uo pipefail
          ABS=(); while IFS= read -r f; do ABS+=("$PWD/$f"); done < targets.txt
          set +e
          OUT=$(cd .review-guidelines/lint && ../node_modules/.bin/textlint -c .textlintrc.json -f compact "${ABS[@]}" 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          # compact 形式: <abs path>: line N, col M, Error - message (rule)
          echo "$OUT" | { grep -E ': line [0-9]+, col [0-9]+' || true; } | while IFS= read -r line; do
            file=${line%%: line *}
            ln=$(printf '%s' "$line" | sed -E 's/.*: line ([0-9]+),.*/\1/')
            rel=${file#"$PWD/"}
            msg=$(printf '%s' "$line" | sed -E 's/^.*, (Error|Warning) - //')
            echo "::error file=${rel},line=${ln}::textlint: ${msg}"
          done
          exit $CODE

      - name: Mermaid の構文チェック
        if: steps.targets.outputs.has_targets == 'true'
        run: |
          set -uo pipefail
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /tmp/pptr.json
          FAIL=0; FIDX=0
          while IFS= read -r f; do
            FIDX=$((FIDX+1))
            # (1) ```mermaid ブロックを開始行番号付きで抜き出し、mmdc でパースを検証する（複数ブロック対応）
            awk -v idx="$FIDX" '
              /^```mermaid[ \t]*$/ { inblk=1; start=NR; fn="/tmp/mmd_" idx "_" NR ".mmd"; next }
              inblk && /^```[ \t]*$/ { close(fn); print start "\t" fn; inblk=0; next }
              inblk { print $0 > fn }
            ' "$f" > /tmp/blocks.tsv || true
            while IFS=$'\t' read -r start fn; do
              if ! err=$(.review-guidelines/node_modules/.bin/mmdc -q -p /tmp/pptr.json -i "$fn" -o "${fn%.mmd}.svg" 2>&1); then
                FAIL=1
                msg=$(printf '%s' "$err" | tr '\n' ' ' | sed 's/  */ /g')
                echo "::error file=${f},line=${start}::Mermaid構文エラー: ${msg}"
              fi
            done < /tmp/blocks.tsv
            # (2) gantt の excludes にある空トークン（", ,"）や末尾カンマを検出する。
            #     mermaid のパーサはこれを許してしまい、mmdc では捕まえられないため補助的に調べる。
            if ! awk '
              /^```mermaid[ \t]*$/ { inblk=1; next }
              inblk && /^```[ \t]*$/ { inblk=0; next }
              inblk && /excludes/ && (/,[ \t]*,/ || /,[ \t]*$/) {
                printf "::error file=%s,line=%d::Mermaid gantt: excludes に空トークンまたは末尾カンマがあります: %s\n", FILENAME, NR, $0
                bad=1
              }
              END { exit bad?1:0 }
            ' "$f"; then
              FAIL=1
            fi
          done < targets.txt
          [ "$FAIL" -eq 0 ] && echo "Mermaid: 問題なし" || { echo "Mermaid 構文エラーを検出"; exit 1; }

  review:
    name: Claude によるレビュー
    needs: [resolve, format-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Checkout review guidelines
        uses: actions/checkout@v7
        with:
          repository: Kenta-Shimoda/review-guidelines
          token: ${{ secrets.GUIDELINES_PAT }}
          path: .review-guidelines

      - name: Compose guidelines
        env:
          REVIEW_PHASE: ${{ needs.resolve.outputs.phase }}
          PHASE_SOURCE: ${{ needs.resolve.outputs.phase_source }}
          REVIEW_STACK: ${{ needs.resolve.outputs.stack }}
          # EC サイトで決済ゲートウェイの API キーを扱う想定
          REVIEW_VISIBILITY: 一般公開
          REVIEW_SENSITIVITY: 高
        run: |
          if ! [[ "$REVIEW_PHASE" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::phase に不正な文字が含まれています: ${REVIEW_PHASE}"
            exit 1
          fi
          if [ -n "$REVIEW_STACK" ] && ! [[ "$REVIEW_STACK" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::stack に不正な文字が含まれています: ${REVIEW_STACK}"
            exit 1
          fi
          PHASE_FILE=$(ls .review-guidelines/phases/*-"${REVIEW_PHASE}".md 2>/dev/null | head -n1)
          if [ -z "$PHASE_FILE" ]; then
            echo "::error::phase '${REVIEW_PHASE}' に対応するファイルが見つかりません"
            exit 1
          fi
          # 整備中（status: draft）の工程はレビューに使えない。
          # ラベルで指定されたときはエラーにし、パスから自動で判定したときは implementation に切り替える。
          if head -n 5 "$PHASE_FILE" | grep -q 'status: draft'; then
            if [ "$PHASE_SOURCE" = "label" ] || [ "$REVIEW_PHASE" = "implementation" ]; then
              echo "::error::phase '${REVIEW_PHASE}' は整備中（status: draft）のためレビューに使用できません"
              exit 1
            fi
            echo "::notice::判定した工程 '${REVIEW_PHASE}' は整備中（status: draft）のため、implementation の観点でレビューします（phase: ラベルで上書き可能）"
            REVIEW_PHASE=implementation
            PHASE_FILE=$(ls .review-guidelines/phases/*-implementation.md | head -n1)
            if head -n 5 "$PHASE_FILE" | grep -q 'status: draft'; then
              echo "::error::phase 'implementation' も整備中（status: draft）のためレビューに使用できません"
              exit 1
            fi
          fi
          if [ -n "${REVIEW_STACK}" ] && [ ! -f ".review-guidelines/stacks/${REVIEW_STACK}.md" ]; then
            echo "::error::stack '${REVIEW_STACK}' に対応するファイルが見つかりません"
            exit 1
          fi
          {
            echo "## レビュー実行コンテキスト"
            echo "- 公開範囲: ${REVIEW_VISIBILITY}"
            echo "- 機密度: ${REVIEW_SENSITIVITY}"
            echo "- 対象工程: ${REVIEW_PHASE}"
            echo "- 対象スタック: ${REVIEW_STACK:-なし}"
            echo
            cat .review-guidelines/common.md
            echo
            cat "$PHASE_FILE"
            if [ -n "${REVIEW_STACK}" ]; then
              echo
              cat ".review-guidelines/stacks/${REVIEW_STACK}.md"
            fi
          } > /tmp/review-guidelines.md
          echo "合成完了: $(wc -l < /tmp/review-guidelines.md) 行（phase=${REVIEW_PHASE} stack=${REVIEW_STACK:-なし}）"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # OIDC 経由の claude[bot] App トークン（Contents:Write を含む）ではなく、
          # contents:read でスコープした標準 GITHUB_TOKEN を使わせる。
          # 万一書き込みを試みても GitHub API 側が拒否する＝インフラ層の歯止め（多層防御）。
          # 副作用: コメントの投稿主が claude[bot] ではなく github-actions[bot] になる。
          github_token: ${{ github.token }}
          # tag モード。github_token（contents:read）を渡しているため、tag モードが行う
          # git push は GitHub API 側で拒否される。
          # 事前に整形したコンテキストで探索が減り、総評はトラッキングコメントに出る。
          track_progress: true
          # 注: tag モードでは下の allowedTools は無視され、action 既定のツールセットが使われる。
          # agent モードへ戻した場合のみ有効（読み取り専用の Grep/Glob で探索の拒否を抑える）。
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob"
          prompt: |
            /tmp/review-guidelines.md にレビュー観点ガイドラインがあります。
            まずこれを読み、書かれた観点と凡例（Must/Should/Nit、ISO/IEC 25010）に
            厳密に従って、このPRの差分をレビューしてください。
            ルール:
            - 指摘は該当コード行へのインラインコメントとして
              mcp__github_inline_comment__create_inline_comment で投稿する
            - 各指摘に重要度（Must/Should/Nit）と品質特性を付ける
            - ガイドライン内で「（この合成では対象外・言及不要）」と
              注記された論点には言及しない
            - 全体総評のみ最後にPRコメントとしてまとめる
            - コードの修正は行わない
