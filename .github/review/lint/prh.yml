version: 1
# 表記ゆれ辞書。最初から網羅は狙わず運用で育てる。
# 【運用ルール】AI レビューや人間のレビューで表記ゆれが見つかったら、この辞書に追記する。
#   追記するときは、誤検知しないか（別の語に反応しないか）を必ず確認する。
#   確認は .github/review/README.md の「ローカルでの実行」の textlint を、リポジトリ内の全 .md に流して行う。
rules:
  # --- 長音（音引き）のゆれ ---
  - expected: サーバー
    pattern: /サーバ(?!ー)/
  - expected: ユーザー
    pattern: /ユーザ(?!ー|ビリティ)/ # 「ユーザビリティ」は正当な語なので除外
  - expected: ユーザビリティ
    pattern: /ユーザービリティ/ # 「ユーザ→ユーザー」の一括置換で生じる破損形を正規表記へ戻す
  - expected: レビュー
    pattern: /レビュ(?![ーア])/ # 「レビュアー」を誤検知しないよう除外

  # --- 同義語のゆれ ---
  # 注: 「利用者 → ユーザー」「会員 → ユーザー」は辞書に入れない。これは表記ゆれではなく別の語であり、
  #     要件整理メモでは「利用者」「会員」が正当な業務用語になりうる。機械的に置換すると文意を壊す。
  #     同義語の使い分けは文脈判断が要るため common.md 4.2（AI の判断）の担当とする。
  - expected: 直感的
    pattern: /直観的/ # UI・要件の文脈では「直感的」が通用表記（「直観」は哲学用語寄り）
