name: Claude Review

# PR の差分を Claude がレビューし、インラインコメントと総評を投稿する。
# レビュー観点と Markdown の書式チェックの設定は .github/review/ にある（仕組みと更新方法は .github/review/README.md）。
# 観点は PR の版がそのまま使われるので、観点を緩める変更は人間が確認すること。
#
# 必要な secrets（リポジトリの Settings → Secrets and variables → Actions に登録する）:
#   CLAUDE_CODE_OAUTH_TOKEN : Claude Code の OAuth トークン
#
# レビューを止める方法（止めたときは失敗ではなくスキップ。理由は skip-notice ジョブが notice で出す）:
#   - リポジトリ変数 CLAUDE_REVIEW_ENABLED を false にする（全 PR で止まる。未設定なら動く）
#   - PR に skip-review ラベルを付ける。トリガーに labeled を含めていないので、
#     PR を作るときに付けるか、付けた後の次の push から効く
#   - draft の PR では動かさない。Ready for review にした時点で動く
# 詳細は .github/review/README.md の「レビューを止めるには」。

on:
  pull_request:
    # labeled は意図して含めない（ラベルの付け外しのたびにレビューが走らないように）
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fork-notice:
    # fork からの PR には secrets が渡らないため、レビューは行わない（失敗ではなくスキップ扱い）。
    # 何もせずに終わると理由が分からないので、ここで notice だけ出す。
    name: fork からの PR のためスキップ
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "::notice::fork からの PR には secrets が渡らないため、Claude によるレビューはスキップします。"

  skip-notice:
    # 変数・ラベル・下書きでレビューを止めたときに、理由を notice で1行出す（失敗ではなくスキップ扱い）。
    # 条件は resolve の if のちょうど裏返しにしておくこと。
    name: 設定によりレビューをスキップ
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (vars.CLAUDE_REVIEW_ENABLED == 'false' ||
       contains(github.event.pull_request.labels.*.name, 'skip-review') ||
       github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - env:
          BY_VARIABLE: ${{ vars.CLAUDE_REVIEW_ENABLED == 'false' }}
          BY_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-review') }}
          BY_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          reasons=()
          [ "$BY_VARIABLE" = "true" ] && reasons+=("リポジトリ変数 CLAUDE_REVIEW_ENABLED が false")
          [ "$BY_LABEL" = "true" ] && reasons+=("skip-review ラベルが付いている")
          [ "$BY_DRAFT" = "true" ] && reasons+=("draft の PR（Ready for review にすると動きます）")
          reason=$(printf '%s、' "${reasons[@]}")
          echo "::notice::Claude によるレビューと書式チェックをスキップします（理由: ${reason%、}）。"

  resolve:
    name: 工程・スタックの判定
    # 以降のジョブ（format-check・review）は needs で resolve に依存するので、ここがスキップされれば一緒にスキップされる
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLAUDE_REVIEW_ENABLED != 'false' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      phase: ${{ steps.detect.outputs.phase }}
      phase_source: ${{ steps.detect.outputs.phase_source }}
      stack: ${{ steps.detect.outputs.stack }}
    steps:
      - name: secrets の登録を確認
        env:
          HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_CLAUDE_TOKEN" != "true" ]; then
            echo "::error::secrets が登録されていません: CLAUDE_CODE_OAUTH_TOKEN。Settings → Secrets and variables → Actions に登録してください。"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # 比較の基準は PR の向き先（main でも coupon でも動くように）
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # --- 1. ラベルによる明示指定を最優先 ---
          # 工程は1つだけ。スタックは複数付けてよい（stack:python-fastapi と stack:typescript-react など）。
          PHASE_LABELS=$(tr ',' '\n' <<< "$LABELS" | sed -n 's/^phase://p')
          if [ "$(grep -c . <<< "$PHASE_LABELS" || true)" -gt 1 ]; then
            echo "::error::phase: ラベルが複数付いています。工程は1つだけ指定してください: $(echo $PHASE_LABELS | tr '\n' ' ')"
            exit 1
          fi
          PHASE=$(head -n1 <<< "$PHASE_LABELS")
          PHASE_SOURCE=label
          STACK=$(tr ',' '\n' <<< "$LABELS" | sed -n 's/^stack://p' | sort -u | paste -sd, -)

          # --- 2. ラベルがなければ変更ファイルのパスから判別 ---
          FILES=""
          if [ -z "$PHASE" ] || [ -z "$STACK" ]; then
            git fetch --no-tags origin "$BASE_REF"
            FILES=$(git -c core.quotepath=false diff --name-only "origin/${BASE_REF}...HEAD")
          fi

          if [ -z "$PHASE" ]; then
            PHASE_SOURCE=auto
            # 工程番号は .github/review/phases/ の通番。複数に当たるときは大きい方を採る。
            # 各ファイルは上から順に照らし、最初に当たった行を採る。そのため
            # テスト（frontend/src/ の中にある）を画面より先に、
            # 「結合試験仕様書」などを「試験仕様」より先に、「詳細設計」を「設計」より先に書く。
            MAX=0
            while IFS= read -r f; do
              n=0
              case "$f" in
                backend/tests/*)                       n=6 ;;  # 単体試験
                frontend/*.test.*|frontend/src/test/*) n=6 ;;  # 単体試験（テスト本体・テスト用の補助）
                backend/app/*|frontend/src/*)          n=5 ;;  # 実装
                docs/*結合試験*)                       n=7 ;;  # 結合試験
                docs/*総合試験*|docs/*システム試験*)   n=8 ;;  # 総合試験
                docs/*単体試験*|docs/*試験仕様*)       n=6 ;;  # 単体試験
                docs/*詳細設計*)                       n=4 ;;  # 詳細設計
                docs/*設計*)                           n=3 ;;  # 基本設計
                docs/*要件*)                           n=2 ;;  # 要件定義
              esac
              if [ "$n" -gt "$MAX" ]; then MAX=$n; fi
            done <<< "$FILES"
            # 01（プロジェクト計画）は講座で扱わないため置いていない
            PHASES=(_ _ requirements basic-design detailed-design \
                    implementation unit-test integration-test system-test)
            if [ "$MAX" -eq 0 ]; then
              PHASE="implementation"
              echo "::notice::工程を判別できなかったため implementation を適用します（phase: ラベルで上書き可能）"
            else
              PHASE="${PHASES[$MAX]}"
            fi
          fi

          # --- 3. スタック: ラベルがなければ変更ファイルから判別（両方に当たれば両方） ---
          if [ -z "$STACK" ]; then
            STACKS=()
            if grep -qE '^backend/.*\.py$' <<< "$FILES"; then
              STACKS+=(python-fastapi)
            fi
            if grep -qE '^frontend/.*\.tsx?$|^frontend/(.*/)?package\.json$' <<< "$FILES"; then
              STACKS+=(typescript-react)
            fi
            STACK=$(IFS=,; echo "${STACKS[*]}")
          fi

          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          echo "phase_source=$PHASE_SOURCE" >> "$GITHUB_OUTPUT"
          echo "stack=$STACK" >> "$GITHUB_OUTPUT"
          echo "判定結果: phase=$PHASE（${PHASE_SOURCE}） stack=${STACK:-なし} (ラベル: ${LABELS:-なし})"

  format-check:
    # 変更された Markdown の書式チェック（markdownlint・textlint の表記ゆれ・Mermaid の構文）。
    # 観点ファイル（.github/review/ の .md）も、変更されれば対象になる。
    # 書式チェックの設定（.github/review/lint/・package.json）を変えたときは、観点ファイル全体も検査する。
    # 対象の .md がなければ、ツールの取得（npm ci）もせずに終える。
    name: Markdown の書式チェック
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # PR の向き先との共通祖先が要る

      - name: 対象の .md を特定
        id: targets
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          # 削除（D）と、中身の変わらないリネーム（R100）は対象外。リネームは移動先のパスを採る。
          git -c core.quotepath=false diff --name-status -M "origin/${BASE_REF}...HEAD" -- '*.md' \
            | awk -F'\t' '$1 ~ /^D/ || $1 == "R100" { next } $1 ~ /^[RC]/ { print $3; next } { print $2 }' \
            > /tmp/targets.txt || true
          # 書式チェックの設定が変わったら、観点ファイル全体を対象に足す
          if [ -n "$(git diff --name-only "origin/${BASE_REF}...HEAD" -- .github/review/lint .github/review/package.json .github/review/package-lock.json)" ]; then
            echo "書式チェックの設定が変わったため、.github/review/ の .md をすべて対象にします。"
            git -c core.quotepath=false ls-files -- '.github/review/*.md' >> /tmp/targets.txt
          fi
          # 念のため実在するファイルのみ残し、重複を除く
          : > targets.txt
          sort -u /tmp/targets.txt | while IFS= read -r f; do
            if [ -n "$f" ] && [ -f "$f" ]; then echo "$f" >> targets.txt; fi
          done
          if [ ! -s targets.txt ]; then
            echo "変更された .md はないため、書式チェックをスキップします。"
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
            echo "=== 対象 ==="; cat targets.txt
          fi

      - uses: actions/setup-node@v7
        if: steps.targets.outputs.has_targets == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/review/package-lock.json

      - name: チェック用ツールのインストール
        if: steps.targets.outputs.has_targets == 'true'
        working-directory: .github/review
        run: npm ci

      - name: markdownlint
        if: steps.targets.outputs.has_targets == 'true'
        run: |
          set -uo pipefail
          # 先頭の ":" は「glob ではなくそのままのパス」の指定。付けないと ( ) [ ] を含むファイル名が黙って対象から外れる
          FILES=(); while IFS= read -r f; do FILES+=(":$f"); done < targets.txt
          set +e
          OUT=$(.github/review/node_modules/.bin/markdownlint-cli2 --config .github/review/lint/.markdownlint-cli2.jsonc "${FILES[@]}" 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          # 形式: <path>.md:<line>[:<col>] <level> <rule> <description>
          echo "$OUT" | sed -nE 's/^([^:]+\.md):([0-9]+)(:[0-9]+)? +(.*)$/::error file=\1,line=\2::markdownlint: \4/p'
          exit $CODE

      - name: textlint（prh の表記ゆれ）
        if: steps.targets.outputs.has_targets == 'true'
        run: |
          # textlint の失敗（終了コード 1）で止めず、全ファイルを見てから結果を返す
          set +e -uo pipefail
          # 1ファイルずつ標準入力で渡す。パスで渡すと glob として解釈され、( ) [ ] を含むファイル名が見つからなくなるため
          FAIL=0
          while IFS= read -r f; do
            OUT=$(.github/review/node_modules/.bin/textlint -c .github/review/lint/.textlintrc.json -f compact \
              --stdin --stdin-filename "$f" < "$f" 2>&1)
            CODE=$?
            [ "$CODE" -eq 0 ] && continue
            FAIL=1
            echo "$OUT"
            # compact 形式: <path>: line N, col M, Error - message (rule)
            { grep -E ': line [0-9]+, col [0-9]+' <<< "$OUT" || true; } | while IFS= read -r line; do
              ln=$(printf '%s' "$line" | sed -E 's/.*: line ([0-9]+),.*/\1/')
              msg=$(printf '%s' "$line" | sed -E 's/^.*, (Error|Warning) - //')
              echo "::error file=${f},line=${ln}::textlint: ${msg}"
            done
          done < targets.txt
          [ "$FAIL" -eq 0 ] && echo "textlint: 問題なし"
          exit $FAIL

      - name: Mermaid の構文チェック
        if: steps.targets.outputs.has_targets == 'true'
        run: |
          mapfile -t FILES < targets.txt
          node .github/review/lint/check-mermaid.mjs "${FILES[@]}"

  review:
    name: Claude によるレビュー
    needs: [resolve, format-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Compose guidelines
        env:
          GUIDELINES_DIR: .github/review
          REVIEW_PHASE: ${{ needs.resolve.outputs.phase }}
          PHASE_SOURCE: ${{ needs.resolve.outputs.phase_source }}
          # カンマ区切りで0個以上（例: python-fastapi,typescript-react）
          REVIEW_STACK: ${{ needs.resolve.outputs.stack }}
          # EC サイトで会員情報と決済ゲートウェイの API キーを扱う想定
          REVIEW_VISIBILITY: 一般公開
          REVIEW_SENSITIVITY: 高
        run: |
          set -euo pipefail
          G="$GUIDELINES_DIR"
          if ! [[ "$REVIEW_PHASE" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::phase に不正な文字が含まれています: ${REVIEW_PHASE}"
            exit 1
          fi
          STACKS=()
          if [ -n "$REVIEW_STACK" ]; then
            IFS=',' read -ra STACKS <<< "$REVIEW_STACK"
          fi
          for s in "${STACKS[@]}"; do
            if ! [[ "$s" =~ ^[a-z0-9-]+$ ]]; then
              echo "::error::stack に不正な文字が含まれています: ${s}"
              exit 1
            fi
            if [ ! -f "$G/stacks/${s}.md" ]; then
              echo "::error::stack '${s}' に対応するファイルが見つかりません"
              exit 1
            fi
          done
          PHASE_FILE=$(ls "$G"/phases/*-"${REVIEW_PHASE}".md 2>/dev/null | head -n1 || true)
          if [ -z "$PHASE_FILE" ]; then
            echo "::error::phase '${REVIEW_PHASE}' に対応するファイルが見つかりません"
            exit 1
          fi
          # 整備中（status: draft）の工程はレビューに使えない。
          # ラベルで指定されたときはエラーにし、パスから自動で判定したときは implementation に切り替える。
          if head -n 5 "$PHASE_FILE" | grep -q 'status: draft'; then
            if [ "$PHASE_SOURCE" = "label" ] || [ "$REVIEW_PHASE" = "implementation" ]; then
              echo "::error::phase '${REVIEW_PHASE}' は整備中（status: draft）のためレビューに使用できません"
              exit 1
            fi
            echo "::notice::判定した工程 '${REVIEW_PHASE}' は整備中（status: draft）のため、implementation の観点でレビューします（phase: ラベルで上書き可能）"
            REVIEW_PHASE=implementation
            PHASE_FILE=$(ls "$G"/phases/*-implementation.md | head -n1)
            if head -n 5 "$PHASE_FILE" | grep -q 'status: draft'; then
              echo "::error::phase 'implementation' も整備中（status: draft）のためレビューに使用できません"
              exit 1
            fi
          fi
          # 凡例は README の legend マーカーの間だけを切り出す（マーカーの行そのものは除く）。
          # マーカーは行全体がそれだけの行に限る（本文中でマーカーに言及している行に反応しないように）
          LEGEND=$(sed -n '/^<!-- legend:start -->[[:space:]]*$/,/^<!-- legend:end -->[[:space:]]*$/{/^<!-- legend:[a-z]* -->[[:space:]]*$/d;p}' "$G/README.md")
          if [ -z "$(tr -d '[:space:]' <<< "$LEGEND")" ]; then
            echo "::error::$G/README.md に凡例（<!-- legend:start --> 〜 <!-- legend:end -->）が見つかりません"
            exit 1
          fi
          STACK_LABEL="なし"
          if [ "${#STACKS[@]}" -gt 0 ]; then
            STACK_LABEL=$(printf '%s、' "${STACKS[@]}")
            STACK_LABEL=${STACK_LABEL%、}
          fi
          {
            echo "## レビュー実行コンテキスト"
            echo "- 公開範囲: ${REVIEW_VISIBILITY}"
            echo "- 機密度: ${REVIEW_SENSITIVITY}"
            echo "- 対象工程: ${REVIEW_PHASE}"
            echo "- 対象スタック: ${STACK_LABEL}"
            echo
            echo "$LEGEND"
            echo
            cat "$G/common.md"
            echo
            cat "$PHASE_FILE"
            for s in "${STACKS[@]}"; do
              echo
              cat "$G/stacks/${s}.md"
            done
          } > /tmp/review-guidelines.md
          echo "合成完了: $(wc -l < /tmp/review-guidelines.md) 行（phase=${REVIEW_PHASE} stack=${STACK_LABEL}）"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # OIDC 経由の claude[bot] App トークン（Contents:Write を含む）ではなく、
          # contents:read でスコープした標準 GITHUB_TOKEN を使わせる。
          # 万一書き込みを試みても GitHub API 側が拒否する＝インフラ層の歯止め（多層防御）。
          # 副作用: コメントの投稿主が claude[bot] ではなく github-actions[bot] になる。
          github_token: ${{ github.token }}
          # tag モード。github_token（contents:read）を渡しているため、tag モードが行う
          # git push は GitHub API 側で拒否される。
          # 事前に整形したコンテキストで探索が減り、総評はトラッキングコメントに出る。
          track_progress: true
          # 注: tag モードでは下の allowedTools は無視され、action 既定のツールセットが使われる。
          # agent モードへ戻した場合のみ有効（読み取り専用の Grep/Glob で探索の拒否を抑える）。
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob"
          prompt: |
            /tmp/review-guidelines.md にレビュー観点ガイドラインがあります。
            まずこれを読み、書かれた観点と凡例（Must/Should/Nit、ISO/IEC 25010）に
            厳密に従って、このPRの差分をレビューしてください。
            凡例はファイルの先頭（レビュー実行コンテキストの直後）にあります。
            ルール:
            - 指摘は該当コード行へのインラインコメントとして
              mcp__github_inline_comment__create_inline_comment で投稿する
            - 各指摘に重要度（Must/Should/Nit）と品質特性を付ける
            - 仕様書（docs/）や設計書と照らして判断し、仕様として定められた挙動は不具合と断定しない
            - ガイドライン内で「（この合成では対象外・言及不要）」と注記された論点は、
              委譲先のファイルが同じガイドラインに含まれていない限り言及しない
              （凡例の「合成された観点の読み方」に従う）
            - 全体総評のみ最後にPRコメントとしてまとめる
            - コードの修正は行わない
