name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: テスト（pytest）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: テスト実行（カバレッジ付き）
        run: python -m pytest --cov=app --cov-report=term-missing

  guard-existing-tests:
    # AIが「テストを通すために既存テストの期待値を緩める」のを機械で止める。
    # 新しいテストファイルの追加は自由。既存テストの変更・削除・リネームだけを検知する。
    # 意図した変更であれば、人間がレビューしたうえで PR に allow-test-change ラベルを付けると通る。
    name: 既存テストの書き換え検知
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 既存テストの変更を確認
        env:
          BASE_REF: ${{ github.base_ref }}
          ALLOWED: ${{ contains(github.event.pull_request.labels.*.name, 'allow-test-change') }}
        run: |
          changed=$(git diff --name-status --diff-filter=MDR "origin/${BASE_REF}...HEAD" -- src/tests/)
          if [ -z "$changed" ]; then
            echo "既存テストの変更はありません。"
            exit 0
          fi
          echo "既存テストが変更されています:"
          echo "$changed"
          if [ "$ALLOWED" = "true" ]; then
            echo "allow-test-change ラベルが付いているため通過します。"
            exit 0
          fi
          echo "::error::既存テストの変更・削除を検知しました。意図した変更なら、人間がレビューしたうえで PR に allow-test-change ラベルを付けてください。"
          exit 1
